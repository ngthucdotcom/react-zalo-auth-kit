# CI/CD configuration consumed by .github/workflows/*.yml (via .github/actions/publish-npm).
# Not part of the published npm package (only src/ is copied into dist/ during build).

NODE_VERSION: "22"
# Used by the develop-push and master-push (rc) workflows. Include install here.
DEV_BUILD_COMMANDS: "npm ci && npm run build"
# Used by the tag-triggered release workflow. Include install here.
PROD_BUILD_COMMANDS: "npm ci && npm run build"
# Only consulted by the develop-push and master-push (rc) workflows; the tag
# release workflow never runs tests. Leave empty to skip the test gate
# (treated as pass). When set, the command must exit 0 or the workflow stops
# before build/publish.
TEST_RUN_COMMANDS: ""
