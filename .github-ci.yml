# CI/CD configuration consumed by .github/workflows/*.yml (via .github/actions/publish-npm).
# Not part of the published npm package (only src/ is copied into dist/ during build).

NODE_VERSION: "20"
INSTALL_COMMANDS: "npm ci"
BUILD_COMMANDS: "npm run build"
# Leave empty to skip the test gate entirely (treated as pass).
# When set, the command must exit 0 or the workflow stops before build/publish.
TEST_RUN_COMMANDS: ""
