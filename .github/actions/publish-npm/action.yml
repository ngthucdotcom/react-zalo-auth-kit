name: 'Publish npm package'
description: >
  Loads build/test config from .github-ci.yml, optionally gates on tests,
  overwrites the package version, builds, and publishes dist/ to npm via
  OIDC Trusted Publishing (requires the calling job to grant
  `permissions: id-token: write` and a matching Trusted Publisher entry
  configured on npmjs.com for this exact repo + workflow filename).

inputs:
  version:
    description: 'Exact semver string to publish (no leading v)'
    required: true
  npm-dist-tag:
    description: 'npm dist-tag to publish under (e.g. dev, rc). Empty = default (latest)'
    required: false
    default: ''
  build-kind:
    description: "Which build commands to use from .github-ci.yml: 'dev' or 'prod'"
    required: true
  run-tests:
    description: 'Whether to run TEST_RUN_COMMANDS (if configured) before building'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Install yq
      shell: bash
      run: |
        if ! command -v yq >/dev/null 2>&1; then
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
        fi

    - name: Load CI config
      id: cfg
      shell: bash
      run: |
        CONFIG_FILE=".github-ci.yml"
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "::error::$CONFIG_FILE not found at repo root"
          exit 1
        fi
        if [ "${{ inputs.build-kind }}" = "prod" ]; then
          BUILD_KEY=".PROD_BUILD_COMMANDS"
        else
          BUILD_KEY=".DEV_BUILD_COMMANDS"
        fi
        {
          echo "node_version=$(yq '.NODE_VERSION // "20"' "$CONFIG_FILE")"
          echo "build_commands=$(yq "${BUILD_KEY} // \"npm ci && npm run build\"" "$CONFIG_FILE")"
          echo "test_commands=$(yq '.TEST_RUN_COMMANDS // ""' "$CONFIG_FILE")"
        } >> "$GITHUB_OUTPUT"

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.cfg.outputs.node_version }}
        registry-url: 'https://registry.npmjs.org'

    - name: Ensure npm supports Trusted Publishing (OIDC)
      shell: bash
      run: npm install -g npm@latest

    - name: Run tests
      if: inputs.run-tests == 'true' && steps.cfg.outputs.test_commands != ''
      shell: bash
      run: ${{ steps.cfg.outputs.test_commands }}

    - name: Set package version
      shell: bash
      run: npm pkg set version="${{ inputs.version }}"

    - name: Build
      shell: bash
      run: ${{ steps.cfg.outputs.build_commands }}

    - name: Publish to npm (OIDC Trusted Publishing)
      shell: bash
      working-directory: dist
      run: |
        if [ -n "${{ inputs.npm-dist-tag }}" ]; then
          npm publish --access public --tag "${{ inputs.npm-dist-tag }}"
        else
          npm publish --access public
        fi
