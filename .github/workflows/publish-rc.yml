name: Publish release-candidate build

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'example/**'
      - 'example-cloud/**'
      - 'passport-cloud/**'
      - 'stories/**'
      - '.storybook/**'
      - '.gitnexus/**'
      - '.claude/**'
      - '**/*.md'
      - 'LICENSE'

concurrency:
  group: publish-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: STAGING
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ngthucdotcom/gh-actions-templates/actions/publish-npm@a746d84
        with:
          version-mode: short-sha
          version-prefix: 1.0.0-rc
          npm-dist-tag: rc
          build-kind: dev
          run-tests: 'true'
