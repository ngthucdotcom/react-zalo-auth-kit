name: Publish release-candidate build

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'example/**'
      - 'example-cloud/**'
      - 'passport-cloud/**'
      - 'stories/**'
      - '.storybook/**'
      - '.gitnexus/**'
      - '.claude/**'
      - '**/*.md'
      - 'LICENSE'

concurrency:
  group: publish-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: STAGING
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "value=1.0.0-rc-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: ./.github/actions/publish-npm
        with:
          version: ${{ steps.version.outputs.value }}
          npm-dist-tag: rc
          build-kind: dev
          run-tests: 'true'
